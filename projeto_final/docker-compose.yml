services:
  db_vector:
    image: pgvector/pgvector:pg16 # Imagem oficial otimizada
    container_name: postgres_iris_cv
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: iris_latente
    ports:
      # 5433 no host evita conflito com outro Postgres local (ex.: pega_db na 5432)
      - "5433:5432"
    volumes:
      - pgdata_vector:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata_vector: